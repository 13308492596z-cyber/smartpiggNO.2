name: Build iPhone test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install signing utility
        run: brew install ldid
      - name: Build and check
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RouteLab-iPhone-test-0.1.0
          path: |
            build/RouteLab-iPhone-0.1.0.tipa
            build/SHA256SUMS.txt
            build/embedded-entitlements.plist
          retention-days: 3
